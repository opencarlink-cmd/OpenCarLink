plugins {
    // Apply the Android library plugin because this module is consumed by an Android app.
    // 应用 Android Library 插件，因为该模块由 Android 应用消费。
    id 'com.android.library'
}

// Apply shared Android SDK and Java defaults after the Android plugin is available.
// 在 Android 插件可用后应用共享的 Android SDK 与 Java 默认配置。
apply from: rootProject.file('gradle/android-common.gradle')

android {
    // Keep the library namespace stable for generated R and BuildConfig classes.
    // 保持 Library 命名空间稳定，用于生成 R 类和 BuildConfig 类。
    namespace = 'com.opencarlink.iccoa'

    defaultConfig {
        // Enable multidex because the migrated ICCOA stack exceeds the single-dex limit.
        // 启用 multidex，因为迁移后的 ICCOA 代码量超过单 dex 限制。
        multiDexEnabled = true
    }

    buildFeatures {
        // Compile the migrated ICCOA AIDL interfaces as part of this library.
        // 将迁移过来的 ICCOA AIDL 接口作为本 Library 的一部分进行编译。
        aidl = true

        // Disable generated BuildConfig because the migrated SDK ships its own compatibility class.
        // 关闭自动生成的 BuildConfig，因为迁移后的 SDK 自带兼容用 BuildConfig 类。
        buildConfig = false
    }

    compileOptions {
        // Keep migrated source files in UTF-8 and desugar Java 8+ library APIs for API 19.
        // 保持迁移源码使用 UTF-8，并为 API 19 脱糖 Java 8+ 库 API。
        encoding = 'UTF-8'
        coreLibraryDesugaringEnabled = true
    }

    packaging {
        jniLibs {
            // Keep the original native-library packaging behavior required by the migrated SDK.
            // 保持迁移后 SDK 所需的原始 native 库打包行为。
            useLegacyPackaging = true
        }
    }

    lint {
        // Keep the migration buildable while API-compatibility findings are handled incrementally.
        // 在逐步处理 API 兼容性问题期间，先保证迁移后的工程可以构建。
        abortOnError = false
    }
}

dependencies {
    // Backport Java 8+ library APIs required by the migrated source on Android 4.4.
    // 为 Android 4.4 回迁迁移源码依赖的 Java 8+ 库 API。
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Compile against the hidden-platform API stubs used by the original demo application.
    // 使用原 Demo 工程依赖的隐藏平台 API stub 进行编译。
    compileOnly files('libs/unsafe-stub.jar')

    // Preserve the dependency set used by the migrated ICCOA demo application.
    // 保留迁移前 ICCOA Demo 应用使用的依赖集合。
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.4.32'
    implementation 'androidx.activity:activity:1.1.0'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core:1.3.2'
    implementation 'androidx.fragment:fragment:1.2.5'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.savedstate:savedstate:1.0.0'
    implementation 'androidx.versionedparcelable:versionedparcelable:1.1.1'
    implementation 'androidx.paging:paging-runtime:2.1.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.room:room-runtime:2.2.6'
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Generate Room database implementation classes for the migrated peer cache.
    // 为迁移后的对端缓存生成 Room 数据库实现类。
    annotationProcessor 'androidx.room:room-compiler:2.2.6'
}
