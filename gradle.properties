# Keep Gradle memory usage predictable and preserve UTF-8 source files.
# 保持 Gradle 内存使用可预测，并确保源文件使用 UTF-8。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution and build cache for faster multi-module builds.
# 开启并行执行和构建缓存，以加速多模块构建。
org.gradle.parallel=true
org.gradle.caching=true

# Use non-transitive R classes for smaller and more predictable resource references.
# 使用非传递 R 类，减小资源引用范围并提高可预测性。
android.nonTransitiveRClass=true

# Enable AndroidX compatibility for future dependencies that require it.
# 为后续需要 AndroidX 的依赖启用兼容模式。
android.useAndroidX=true
