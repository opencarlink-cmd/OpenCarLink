plugins {
    // Apply the Android Library plugin because this module is consumed by Android applications.
    // 应用 Android Library 插件，因为该模块由 Android 应用消费。
    id 'com.android.library'
}

// Apply shared Android SDK and Java defaults after the Android plugin is available.
// 在 Android 插件可用后应用共享的 Android SDK 与 Java 默认配置。
apply from: rootProject.file('gradle/android-common.gradle')

android {
    // Keep the library namespace stable for generated R and BuildConfig classes.
    // 保持 Library 命名空间稳定，用于生成 R 类和 BuildConfig 类。
    namespace = 'com.opencarlink.language'

    lint {
        // The consuming application disables App Bundle language splitting because
        // this library changes the application locale at runtime.
        // 消费应用已禁用 App Bundle 语言拆分，因为该 Library 会在运行时切换应用 locale。
        disable.add('AppBundleLocaleChanges')
    }
}
